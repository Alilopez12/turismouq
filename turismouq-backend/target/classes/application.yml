server:
  port: 8080

spring:
  application:
    name: turismouq-backend

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: TURISMO_UQ
    password: "Turismo2026#"
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    co.edu.uniquindio.turismouq: DEBUG
