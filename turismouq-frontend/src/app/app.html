<header class="barra-navegacion">
  <div class="contenedor-barra">
    <!-- Marca / Brand -->
    <a routerLink="/catalogo" class="marca">
      <div class="logo-emblema" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 19.5h20L12 2z" />
          <path d="M12 10.5l-4.5 9h9l-4.5-9z" fill="rgba(255,255,255,0.28)" />
          <circle cx="12" cy="7.5" r="1.2" fill="currentColor" stroke="none" />
        </svg>
      </div>
      <div class="marca-textos">
        <span class="marca-titulo">TurismoUQ</span>
      </div>
    </a>

    <!-- Floating Segmented Pill Navigation Dock -->
    <nav class="muelle-navegacion" aria-label="Navegación Principal">
      <a routerLink="/catalogo" routerLinkActive="activo" class="enlace-pildora">
        <svg class="icono-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
        </svg>
        <span>Explorar Destinos</span>
      </a>

      <a routerLink="/reservas" routerLinkActive="activo" class="enlace-pildora">
        <svg class="icono-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
          <path d="M9 16l2 2 4-4"></path>
        </svg>
        <span>Reservar Estadía</span>
      </a>

      <a routerLink="/liquidaciones" routerLinkActive="activo" class="enlace-pildora">
        <svg class="icono-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"></rect>
          <line x1="2" y1="10" x2="22" y2="10"></line>
          <line x1="6" y1="15" x2="10" y2="15"></line>
        </svg>
        <span>Liquidar Lotes</span>
      </a>

      <a routerLink="/analitica" routerLinkActive="activo" class="enlace-pildora">
        <svg class="icono-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Data Studio (8 SQL)</span>
      </a>

      <a routerLink="/auditoria" routerLinkActive="activo" class="enlace-pildora">
        <svg class="icono-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          <polyline points="9 12 11 14 15 10"></polyline>
        </svg>
        <span>Auditoría</span>
      </a>

      <a routerLink="/tablespace" routerLinkActive="activo" class="enlace-pildora">
        <svg class="icono-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
        </svg>
        <span>Tablespace Storage</span>
      </a>
    </nav>

    <!-- Estado Motor Oracle -->
    <div class="estado-motor">
      <div class="pildora-estado" title="Conexión activa al motor Oracle Database 21c Express Edition">
        <span class="punto-pulso"></span>
        <span class="texto-estado">Base de datos activa</span>
      </div>
    </div>
  </div>
</header>

<main class="cuerpo-aplicacion">
  <router-outlet></router-outlet>
</main>
