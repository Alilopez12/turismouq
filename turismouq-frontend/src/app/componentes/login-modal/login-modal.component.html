<!-- Fondo oscuro con desenfoque de fondo -->
<div class="modal-backdrop" (click)="cerrarModal()">
  <div class="modal-contenedor" (click)="$event.stopPropagation()">

    <!-- Cabecera del Modal -->
    <div class="modal-cabecera">
      <div class="cabecera-info">
        <div class="icono-seguridad">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div>
          <h3>Autenticación y Control de Acceso</h3>
          <p class="subtexto-cabecera">Acceso granular por roles definidos para TurismoUQ</p>
        </div>
      </div>
      <button type="button" class="btn-cerrar" (click)="cerrarModal()" title="Cerrar modal">
        ✕
      </button>
    </div>

    <!-- Pestañas: Login vs Registro -->
    <div class="selector-pestanas">
      <button 
        type="button" 
        class="tab-btn" 
        [class.activo]="pestanaActiva === 'login'" 
        (click)="cambiarPestana('login')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        <span>Iniciar Sesión</span>
      </button>

      <button 
        type="button" 
        class="tab-btn" 
        [class.activo]="pestanaActiva === 'registro'" 
        (click)="cambiarPestana('registro')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <line x1="20" y1="8" x2="20" y2="14"></line>
          <line x1="23" y1="11" x2="17" y2="11"></line>
        </svg>
        <span>Crear Nueva Cuenta</span>
      </button>
    </div>

    <!-- Alertas de Estado -->
    <div *ngIf="mensajeError" class="alerta alerta-error">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
      <span>{{ mensajeError }}</span>
    </div>

    <div *ngIf="mensajeExito" class="alerta alerta-exito">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>{{ mensajeExito }}</span>
    </div>

    <!-- CUERPO PESTAÑA 1: INICIAR SESIÓN -->
    <div class="cuerpo-tab" *ngIf="pestanaActiva === 'login'">
      <form (ngSubmit)="iniciarSesion()" class="formulario-auth">
        <div class="campo-grupo">
          <label class="etiqueta-campo">Nombre de Usuario</label>
          <div class="input-con-icono">
            <svg class="icono-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input 
              type="text" 
              class="input-control" 
              placeholder="Ej: USR_RECEPCION_01 o admin" 
              [(ngModel)]="loginForm.usuario" 
              name="usuario" 
              required 
              autocomplete="username" />
          </div>
        </div>

        <div class="campo-grupo">
          <label class="etiqueta-campo">Contraseña</label>
          <div class="input-con-icono">
            <svg class="icono-campo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input 
              type="password" 
              class="input-control" 
              placeholder="••••••••••••" 
              [(ngModel)]="loginForm.contrasena" 
              name="password" 
              required 
              autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" class="btn-primario-auth" [disabled]="cargando">
          <span *ngIf="!cargando">Acceder al Sistema</span>
          <span *ngIf="cargando">Verificando en Oracle XE...</span>
        </button>
      </form>

      <!-- Chips de Acceso Rápido para Demostración -->
      <div class="seccion-chips-demo">
        <div class="separador-o">
          <span>O selecciona una cuenta preconfigurada para probar</span>
        </div>
        <div class="rejilla-chips">
          <button 
            type="button" 
            class="chip-rol chip-recepcion" 
            (click)="autollenarUsuario('USR_RECEPCION_01', 'Turismo2026#')">
            <strong>Recepción</strong>
            <small>Check-in & Vouchers</small>
          </button>

          <button 
            type="button" 
            class="chip-rol chip-admin" 
            (click)="autollenarUsuario('USR_ADMIN_01', 'Turismo2026#')">
            <strong>Admin Alojamiento</strong>
            <small>Alojamientos & Liquidación</small>
          </button>

          <button 
            type="button" 
            class="chip-rol chip-gerente" 
            (click)="autollenarUsuario('USR_GERENTE_01', 'Turismo2026#')">
            <strong>Gerente</strong>
            <small>Data Studio & Ocupación</small>
          </button>

          <button 
            type="button" 
            class="chip-rol chip-auditor" 
            (click)="autollenarUsuario('USR_AUDITOR_01', 'Turismo2026#')">
            <strong>Auditor</strong>
            <small>Auditoría & Tablespace</small>
          </button>

          <button 
            type="button" 
            class="chip-rol chip-super" 
            (click)="autollenarUsuario('ADMIN_TOTAL', 'Turismo2026#')">
            <strong>Super Admin</strong>
            <small>Acceso a todos los módulos</small>
          </button>
        </div>
      </div>
    </div>

    <!-- CUERPO PESTAÑA 2: CREAR NUEVA CUENTA -->
    <div class="cuerpo-tab" *ngIf="pestanaActiva === 'registro'">
      <form (ngSubmit)="registrarUsuario()" class="formulario-auth">
        <div class="campo-grupo">
          <label class="etiqueta-campo">Nombre Completo</label>
          <input 
            type="text" 
            class="input-control" 
            placeholder="Ej: Laura Gómez Cardona" 
            [(ngModel)]="registroForm.nombreCompleto" 
            name="nombreCompleto" 
            required />
        </div>

        <div class="campo-grupo">
          <label class="etiqueta-campo">Correo Electrónico</label>
          <input 
            type="email" 
            class="input-control" 
            placeholder="Ej: laura.gomez@turismouq.com" 
            [(ngModel)]="registroForm.correo" 
            name="correo" 
            required />
        </div>

        <div class="fila-doble">
          <div class="campo-grupo">
            <label class="etiqueta-campo">Nombre de Usuario</label>
            <input 
              type="text" 
              class="input-control" 
              placeholder="Ej: laurag_rec" 
              [(ngModel)]="registroForm.usuario" 
              name="regUsuario" 
              required />
          </div>

          <div class="campo-grupo">
            <label class="etiqueta-campo">Contraseña</label>
            <input 
              type="password" 
              class="input-control" 
              placeholder="••••••••" 
              [(ngModel)]="registroForm.contrasena" 
              name="regClave" 
              required />
          </div>
        </div>

        <div class="campo-grupo">
          <label class="etiqueta-campo">Rol Asignado en la Base de Datos</label>
          <select 
            class="input-control selector-rol" 
            [(ngModel)]="registroForm.rol" 
            name="rol">
            <option *ngFor="let r of rolesDisponibles" [value]="r.valor">
              {{ r.etiqueta }}
            </option>
          </select>
          <small class="ayuda-rol">
            Cada rol otorga permisos y vistas exclusivas definidas según las reglas de negocio en Oracle 21c.
          </small>
        </div>

        <button type="submit" class="btn-primario-auth" [disabled]="cargando">
          <span *ngIf="!cargando">Registrar y Acceder</span>
          <span *ngIf="cargando">Guardando en USUARIO_SISTEMA...</span>
        </button>
      </form>
    </div>

  </div>
</div>
